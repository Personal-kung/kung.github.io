<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== SEO ===== -->
  <title>Portfolio Summary | Kelvin Kung</title>
  <meta name="description" content="A curated collection of project outcomes and engineering deliverables by Kelvin Kung." />
  <meta name="author" content="Kelvin Kung" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />

  <!-- ===== Fonts ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ===== NAVIGATION ===== -->
  <header role="banner">
    <nav class="navbar" aria-label="Main navigation">
      <a href="index.html" class="logo" data-lang="name" aria-label="Home">Kelvin Kung</a>
      <ul class="nav-links" role="list">
        <li><a href="index.html#about"            data-lang="nav-about">About</a></li>
        <li><a href="index.html#experience-summary" data-lang="nav-exp">Experience</a></li>
        <li><a href="index.html#projects"         data-lang="nav-projects">Projects</a></li>
        <li><a href="index.html#contact"          data-lang="nav-contact">Contact</a></li>
      </ul>
      <div class="nav-right">
        <select id="lang-select" aria-label="Language selector">
          <option value="en">EN</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="es">ES</option>
        </select>
        <button class="nav-menu-btn" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ===== SUMMARY HERO ===== -->
  <section class="banner banner--summary" id="home">
    <h1 id="product-title">Product Portfolio</h1>
    <p id="product-subtitle">Select a project below to learn more about my contributions to this field.</p>
  </section>

  <!-- ===== PROJECTS LIST ===== -->
  <main>
    <div id="summary-container" role="list">
      <!-- Filled dynamically by portfolio_summary.js -->
    </div>
  </main>

  <!-- ===== CONTACT ===== -->
  <section class="contact" id="contact" aria-labelledby="contact-heading">
    <h2 id="contact-heading" data-lang="contact-title">Contact</h2>
    <p data-lang="contact-text">Interested in working or collaborating with me?</p>
    <div class="contact-links">
      <a href="mailto:kelvin.kung@utp.ac.pa" id="footer-email" class="btn">Email</a>
      <a href="https://github.com/kelvinutp" target="_blank" rel="noopener" id="footer-github" class="btn btn-ghost">GitHub</a>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer role="contentinfo">
    <p>© <span id="year"></span> <span data-lang="footer-name">Kelvin Kung</span>. All rights reserved.</p>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="portfolio_summary.js"></script>

  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks   = document.querySelector(".nav-links");
    if (menuToggle && navLinks) {
      menuToggle.addEventListener("click", () => {
        const open = navLinks.classList.toggle("open");
        menuToggle.setAttribute("aria-expanded", open);
      });
    }

    // Navbar scroll effect
    const header = document.querySelector("header");
    window.addEventListener("scroll", () => {
      header.classList.toggle("scrolled", window.scrollY > 40);
    }, { passive: true });
    
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
