<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Summary | Kelvin Kung</title>
    <!-- Reusing main styles for consistency -->
    <link rel="stylesheet" href="style.css">
    <!-- Specific styles for this page -->
    <link rel="stylesheet" href="portfolio_summary.css">
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">Kelvin Kung</a></div>
            <!-- Language selector -->
            <select id="lang-select">
                <option value="en">EN</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="es">ES</option>
            </select>
        </nav>
    </header>

    <!-- ===== SUMMARY HERO ===== -->
    <section class="summary-hero">
        <h1 id="product-title">Product Portfolio</h1>
        <p id="product-subtitle">Select a project below to learn more about my contributions to this field.</p>
    </section>

    <!-- ===== PROJECTS LIST ===== -->
    <section class="summary-projects">
        <div id="summary-container" class="interactive-container">
            <!-- Filled dynamically by portfolio_summary.js -->
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© <span id="year"></span> Kelvin Kung.</p>
    </footer>

    <script src="portfolio_summary.js"></script>
</body>

</html>
